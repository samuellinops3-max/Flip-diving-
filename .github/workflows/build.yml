name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: meu-player-mp3
          path: "*.pkg"